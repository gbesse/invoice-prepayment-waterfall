[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-prepayment-waterfall"
version = "0.1.0a1"
description = "FR: Réconcilier acomptes soldes et arrondis en décimal exact | EN: Reconcile prepayments balances and exact decimal rounding | ES: Conciliar anticipos saldos y redondeos decimales exactos"
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
invoice-prepayment-waterfall = "invoice_prepayment_waterfall.__main__:main"

[tool.setuptools.packages.find]
include = ["invoice_prepayment_waterfall*"]
